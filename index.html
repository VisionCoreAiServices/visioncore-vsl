<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F172A">

  <!-- SEO Best Practices -->
  <title>15-20 Qualified Bookings Guaranteed | VisionCore AI</title>
  <meta name="description" content="Replace your ad spend guesswork. Get consistent, ready-to-close prospects on autopilot. Watch our VSL and book a call with VisionCore AI today.">
  <meta name="author" content="VisionCore AI">

  <!-- Open Graph Protocol (Social Sharing) -->
  <meta property="og:title" content="15-20 Qualified Bookings Guaranteed | VisionCore AI">
  <meta property="og:description" content="Replace your ad spend guesswork. Get consistent, ready-to-close prospects on autopilot.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://visioncoreai.net/">
  <meta property="og:image" content="assets/poster.jpg">

  <!-- Favicon -->
  <link rel="icon" href="assets/logo.png" type="image/png">

  <!-- Google Fonts: Outfit (for headlines) & Inter (for copy) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="index.css">

  <!-- JavaScript -->
  <script defer src="index.js"></script>

  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1367001485498235');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1367001485498235&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>
<body>

  <!-- Header Section (Clean, Brand-Focused, No distractions) -->
  <header class="header fade-in">
    <div class="header-container">
      <a href="https://visioncoreai.net/" class="logo-link">
        <img src="assets/logo.png" alt="VisionCore AI Logo" class="logo-img" width="32" height="32">
        <span class="logo-text">VisionCore<span class="text-accent">.Ai</span></span>
      </a>
    </div>
  </header>

  <!-- Main VSL Container -->
  <main class="main-content">
    <div class="hero-container">
      <!-- Headline & Copy -->
      <h1 class="headline fade-in delay-1"><span class="headline-blue">15-20 Qualified Bookings</span> <span class="headline-underline">Guaranteed</span><span class="headline-checkmark">✓</span></h1>
      <p class="supporting-copy fade-in delay-2">Stop wasting time on tire kickers. Only see ready to close bookings.</p>

      <!-- YouTube Embedded Video Player -->
      <div class="video-wrapper fade-in delay-3" id="vsl-video-wrapper">
        <iframe
          id="vsl-player"
          class="video-player"
          src="https://www.youtube.com/embed/qmQ7qBA8TJA"
          title="VisionCore AI - Qualified Bookings Guaranteed"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <!-- Main Call to Action -->
      <div class="cta-container fade-in delay-4">
        <a href="https://calendly.com/visioncore-ai-inbox/30min" class="btn btn-large js-book-call" id="main-cta">
          Book Call
        </a>
      </div>
    </div>
  </main>

  <!-- Sticky Mobile-Only Bottom CTA -->
  <div id="mobile-sticky-cta" class="sticky-cta-bar">
    <div class="sticky-cta-content">
      <a href="https://calendly.com/visioncore-ai-inbox/30min" class="btn btn-sticky js-book-call">
        Book Call
      </a>
    </div>
  </div>

  <!-- Lead Capture Modal -->
  <div id="lead-modal-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-intro-heading">
      <button type="button" class="modal-close" id="modal-close-btn" aria-label="Close application form">✕</button>

      <div id="modal-form-view">
        <p class="modal-intro" id="modal-intro-heading"><strong>Quick Application</strong> — Fill out in under a minute to see if you're a right fit.</p>

        <form id="lead-form" action="https://formspree.io/f/maeweyrw" method="POST" novalidate>
          <div class="form-group">
            <label for="field-name">Name</label>
            <input type="text" id="field-name" name="name" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="field-phone">Phone</label>
            <input type="tel" id="field-phone" name="phone" autocomplete="tel" inputmode="numeric" placeholder="(555) 123-4567" maxlength="14" required>
          </div>

          <div class="form-group">
            <label for="field-email">Email</label>
            <input type="email" id="field-email" name="email" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="field-company">Company Name</label>
            <input type="text" id="field-company" name="company" autocomplete="organization" required>
          </div>

          <div class="form-group">
            <label for="field-revenue">Monthly Revenue</label>
            <select id="field-revenue" name="monthly_revenue" required>
              <option value="" disabled selected>Select an option</option>
              <option value="Below $5k">Below $5k</option>
              <option value="$5k-$10k">$5k - $10k</option>
              <option value="$10k-$30k">$10k - $30k</option>
              <option value="$30k-$50k">$30k - $50k</option>
              <option value="$50k-$100k">$50k - $100k</option>
              <option value="$100k+">$100k+</option>
            </select>
          </div>

          <div class="form-group">
            <label for="field-discovery">What would consistent, predictable lead flow mean for your business? <span class="label-optional">(optional)</span></label>
            <textarea id="field-discovery" name="discovery_question" rows="3"></textarea>
          </div>

          <p class="form-error" id="form-error" role="alert" hidden></p>

          <button type="submit" class="btn btn-large modal-submit" id="modal-submit-btn">Submit Application</button>
        </form>
      </div>

      <div id="modal-success-view" class="modal-success" hidden>
        <div class="success-check">✓</div>
        <p class="success-message">Thanks for filling this out.</p>
        <a href="https://calendly.com/visioncore-ai-inbox/30min" class="btn btn-large" id="modal-next-btn">Next</a>
      </div>
    </div>
  </div>

</body>
</html>

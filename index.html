<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F172A">
  
  <!-- SEO Best Practices -->
  <title>15-20 Qualified Bookings Guaranteed | VisionCore AI</title>
  <meta name="description" content="Replace your ad spend guesswork. Get consistent, ready-to-close prospects on autopilot. Watch our VSL and book a call with VisionCore AI today.">
  <meta name="author" content="VisionCore AI">
  
  <!-- Open Graph Protocol (Social Sharing) -->
  <meta property="og:title" content="15-20 Qualified Bookings Guaranteed | VisionCore AI">
  <meta property="og:description" content="Replace your ad spend guesswork. Get consistent, ready-to-close prospects on autopilot.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://visioncoreai.net/">
  <meta property="og:image" content="assets/poster.jpg">

  <!-- Favicon -->
  <link rel="icon" href="assets/logo.png" type="image/png">

  <!-- Google Fonts: Outfit (for headlines) & Inter (for copy) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="index.css">
  
  <!-- JavaScript -->
  <script defer src="index.js"></script>
</head>
<body>

  <!-- Header Section (Clean, Brand-Focused, No distractions) -->
  <header class="header fade-in">
    <div class="header-container">
      <a href="https://visioncoreai.net/" class="logo-link">
        <img src="assets/logo.png" alt="VisionCore AI Logo" class="logo-img" width="32" height="32">
        <span class="logo-text">VisionCore<span class="text-accent">.Ai</span></span>
      </a>
    </div>
  </header>

  <!-- Main VSL Container -->
  <main class="main-content">
    <div class="hero-container">
      <!-- Headline & Copy -->
      <h1 class="headline fade-in delay-1"><span class="headline-blue">15-20 Qualified Bookings</span> <span class="headline-underline">Guaranteed</span><span class="headline-checkmark">✓</span></h1>
      <p class="supporting-copy fade-in delay-2">Stop wasting ad spend on tire-kickers. Only see ready-to-book leads.</p>

      <!-- Standard HTML5 Video Player -->
      <div class="video-wrapper fade-in delay-3" id="vsl-video-wrapper">
        <video 
          id="vsl-player" 
          controls 
          preload="metadata" 
          width="1920" 
          height="1080" 
          poster="assets/poster.jpg"
          class="video-player"
        >
          <source src="video/VSL_COMP.mp4" type="video/mp4">
          Your browser does not support the video tag. Please update your browser to watch this video.
        </video>
      </div>

      <!-- Main Call to Action -->
      <div class="cta-container fade-in delay-4">
        <a href="https://calendly.com/visioncore-ai-inbox/30min" class="btn btn-large" id="main-cta">
          Book Call
        </a>
      </div>
    </div>
  </main>

  <!-- Sticky Mobile-Only Bottom CTA -->
  <div id="mobile-sticky-cta" class="sticky-cta-bar">
    <div class="sticky-cta-content">
      <a href="https://calendly.com/visioncore-ai-inbox/30min" class="btn btn-sticky">
        Book Call
      </a>
    </div>
  </div>

</body>
</html>
